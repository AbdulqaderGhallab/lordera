<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a09">
  <meta name="description" content="لورديرا — مساحة حوار ذكية، هادئة، ومصممة للأفكار الكبيرة. نص، صوت، وتحليل.">
  <title>لورديرا — مساحة حوار ذكية</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #c4a46a;
      --gold-light: #dfc48f;
      --bg: #090a09;
      --side: #0b0c0b;
      --panel: #111310;
      --text: #eceae4;
      --muted: #85857d;
      --line: rgba(224,207,169,.09);
      font-family: "Noto Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 320px; height: 100%; margin: 0; }
    body { overflow: hidden; background: var(--bg); color: var(--text); font-size: 14px; }
    button, textarea { color: inherit; font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, textarea:focus-visible { outline: 2px solid rgba(196,164,106,.75); outline-offset: 3px; }
    ::selection { background: rgba(196,164,106,.3); color: #fff; }
    .app { display: flex; width: 100%; height: 100dvh; min-height: 560px; overflow: hidden; background: var(--bg); }
    .sidebar { position: relative; z-index: 10; display: flex; flex: 0 0 274px; flex-direction: column; min-width: 245px; padding: 30px 18px 16px; border-left: 1px solid var(--line); background: var(--side); }
    .brand-row { display: flex; align-items: center; justify-content: space-between; padding: 0 7px 31px; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { display: block; flex: 0 0 auto; color: var(--gold); }
    .brand-name { color: #f0ede5; font-family: "Noto Naskh Arabic", "Times New Roman", serif; font-size: 24px; font-weight: 600; line-height: 1.1; }
    .gold-dot { color: var(--gold); }
    .brand-caption { margin-top: 4px; color: #787870; font-size: 10px; letter-spacing: .04em; }
    .new-chat { display: flex; align-items: center; gap: 11px; width: 100%; height: 48px; padding: 0 11px; border: 1px solid rgba(196,164,106,.27); border-radius: 11px; background: linear-gradient(105deg, rgba(196,164,106,.11), rgba(196,164,106,.035)); color: #e8ddc7; text-align: right; font-size: 13px; transition: .2s ease; }
    .new-chat:hover { border-color: rgba(196,164,106,.5); background: rgba(196,164,106,.12); transform: translateY(-1px); }
    .new-chat-icon { display: grid; width: 25px; height: 25px; place-items: center; border: 1px solid rgba(196,164,106,.35); border-radius: 8px; color: var(--gold-light); }
    .shortcut { margin-right: auto; color: #77776f; direction: ltr; font: 10px Arial, sans-serif; }
    .side-section { margin-top: 33px; }
    .section-label { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; color: #7b7b73; font-size: 11px; font-weight: 500; }
    .count { color: #5f6058; direction: ltr; font: 10px Arial, sans-serif; }
    .chat-list { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
    .chat-link { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 42px; padding: 0 10px; border: 1px solid transparent; border-radius: 9px; background: transparent; color: #8c8c84; text-align: right; transition: .18s ease; }
    .chat-link:hover { background: #111310; color: #d2d0c8; }
    .chat-link.active { border-color: rgba(224,207,169,.07); background: #151613; color: #e0d7c4; }
    .chat-icon { flex: 0 0 auto; color: #79786f; }
    .chat-link.active .chat-icon { color: var(--gold); }
    .chat-title { flex: 1; overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .active-mark { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px rgba(196,164,106,.6); }
    .side-bottom { margin-top: auto; }
    .preview-card { padding: 13px 13px 12px; border: 1px solid rgba(224,207,169,.08); border-radius: 11px; background: linear-gradient(140deg, rgba(196,164,106,.045), rgba(255,255,255,.012)); }
    .preview-title { display: flex; align-items: center; gap: 8px; color: #c9c1b1; font-size: 11px; }
    .preview-orbit { display: grid; width: 24px; height: 24px; place-items: center; border: 1px solid rgba(196,164,106,.22); border-radius: 50%; color: var(--gold); }
    .preview-card p { margin: 8px 0 0; color: #77776f; font-size: 10px; line-height: 1.7; }
    .profile { display: flex; align-items: center; gap: 10px; padding: 16px 4px 1px; }
    .profile-avatar { display: grid; width: 31px; height: 31px; place-items: center; border: 1px solid rgba(196,164,106,.26); border-radius: 50%; background: rgba(196,164,106,.08); color: #d8c49b; font-size: 12px; }
    .profile-copy { display: flex; flex: 1; flex-direction: column; gap: 2px; color: #c7c5bd; font-size: 11px; }
    .profile-copy small { color: #70716a; font-size: 9px; }
    .profile-arrow { color: #686960; }
    .side-close, .mobile-menu, .scrim { display: none; }

    .main { position: relative; display: flex; flex: 1; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; background: #090a09; }
    .main::before { position: absolute; z-index: 0; top: -330px; left: 30%; width: 720px; height: 560px; border-radius: 50%; background: radial-gradient(ellipse, rgba(162,128,67,.055), rgba(162,128,67,.018) 34%, transparent 70%); content: ""; pointer-events: none; }
    .topbar { position: relative; z-index: 2; display: flex; flex: 0 0 73px; align-items: center; justify-content: space-between; padding: 0 clamp(22px,4.2vw,59px); border-bottom: 1px solid rgba(224,207,169,.055); }
    .top-leading, .top-actions { display: flex; align-items: center; gap: 13px; }
    .session { display: flex; flex-direction: column; gap: 2px; }
    .session-overline { color: #73746c; font-size: 9px; letter-spacing: .04em; }
    .session-title { max-width: 300px; overflow: hidden; color: #d9d7d0; font-size: 13px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
    .model { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid rgba(224,207,169,.085); border-radius: 18px; color: #a9a79e; font-size: 10px; }
    .model-dot { width: 5px; height: 5px; border-radius: 50%; background: #b49a68; box-shadow: 0 0 7px rgba(196,164,106,.42); transition: background .3s, box-shadow .3s; }
    .icon-button { display: grid; width: 34px; height: 34px; flex: 0 0 auto; place-items: center; border: 1px solid transparent; border-radius: 9px; background: transparent; color: #898980; transition: .18s ease; }
    .icon-button:hover { border-color: rgba(224,207,169,.1); background: rgba(255,255,255,.035); color: #eee9dd; }
    .top-new { width: 32px; height: 32px; border-color: rgba(224,207,169,.09); color: #b4a782; }
    .stage { position: relative; z-index: 1; display: flex; flex: 1; min-height: 0; overflow: auto; scrollbar-color: #333127 transparent; scrollbar-width: thin; }
    .thread { display: flex; flex-direction: column; width: min(100%,820px); min-height: 100%; margin: 0 auto; padding: 30px 30px 20px; }
    .thread-date { display: flex; align-items: center; justify-content: center; gap: 11px; margin: 3px 0 34px; color: #67675f; font-size: 10px; }
    .thread-date span { width: 21px; height: 1px; background: rgba(224,207,169,.13); }
    .messages { display: flex; flex-direction: column; gap: 27px; padding-bottom: 10px; }
    .message-row { display: flex; align-items: flex-start; gap: 11px; animation: message-in .38s cubic-bezier(.2,.7,.2,1) both; }
    .message-row.user { justify-content: flex-start; }
    .message-row.assistant { justify-content: flex-end; }
    .assistant-avatar { display: grid; width: 30px; height: 30px; flex: 0 0 auto; place-items: center; border: 1px solid rgba(196,164,106,.17); border-radius: 50%; background: radial-gradient(circle at 35% 28%, rgba(196,164,106,.14), rgba(196,164,106,.02) 75%); color: var(--gold); }
    .assistant-avatar .brand-mark { width: 25px; height: 25px; }
    .message-content { display: flex; flex: 0 1 auto; flex-direction: column; align-items: flex-start; max-width: min(78%,600px); }
    .author { display: flex; align-items: center; gap: 7px; margin: 0 4px 7px 0; color: #c9b78e; font-size: 11px; font-weight: 550; }
    .time { color: #6f7068; font-size: 10px; font-weight: 400; }
    .bubble { color: #cbc9c1; font-size: 13px; line-height: 1.95; }
    .bubble p { margin: 0; white-space: pre-line; }
    .bubble p.error-text { color: #d99a8a; }
    .user-bubble { padding: 10px 15px 11px; border: 1px solid rgba(224,207,169,.075); border-radius: 14px 4px 14px 14px; background: #141613; color: #d9d7cf; }
    .assistant-bubble { padding: 0 3px; color: #c9c8c0; }
    .chat-media-audio { width: 100%; margin-top: 10px; }
    .analysis-details { margin-top: 10px; width: 100%; }
    .analysis-details summary { cursor: pointer; color: var(--gold); font-size: 10px; padding: 2px 0; }
    .analysis-details pre { background: #0a0b0a; padding: 10px; border-radius: 6px; overflow: auto; max-height: 340px; font-size: 10px; margin-top: 6px; border: 1px solid rgba(224,207,169,.1); direction: ltr; text-align: left; color: #c9c8c0; font-family: ui-monospace, "Courier New", monospace; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
    .suggestions button { padding: 5px 11px 6px; border: 1px solid rgba(196,164,106,.2); border-radius: 16px; background: rgba(196,164,106,.035); color: #c5b48f; font-size: 10px; transition: .2s ease; }
    .suggestions button:hover { border-color: rgba(196,164,106,.45); background: rgba(196,164,106,.1); }
    .copy-button { display: inline-flex; align-items: center; gap: 5px; margin: 6px 2px 0; padding: 3px 5px; border: 0; background: transparent; color: #73746d; font-size: 9px; opacity: .74; }
    .typing-bubble { display: flex; align-items: center; gap: 5px; height: 31px; padding: 0 11px; border: 1px solid rgba(224,207,169,.08); border-radius: 13px; background: rgba(255,255,255,.018); }
    .typing-bubble i { width: 4px; height: 4px; border-radius: 50%; background: #c5a870; animation: pulse 1.05s ease-in-out infinite; }
    .typing-bubble i:nth-child(2) { animation-delay: .14s; }
    .typing-bubble i:nth-child(3) { animation-delay: .28s; }

    .dock { position: relative; z-index: 3; flex: 0 0 auto; padding: 13px 24px 19px; background: linear-gradient(180deg,rgba(9,10,9,0),#090a09 24%); }
    .composer-wrap { width: min(100%,760px); margin: 0 auto; }
    .file-pill { display: inline-flex; align-items: center; gap: 6px; margin: 0 4px 8px; padding: 5px 11px; border: 1px solid rgba(196,164,106,.28); background: rgba(196,164,106,.06); color: #d0bd94; border-radius: 12px; font-size: 10px; }
    .file-pill[hidden] { display: none; }
    .file-pill .clear-file { background: none; border: 0; color: #9a8a63; font-size: 12px; padding: 0 2px; cursor: pointer; line-height: 1; }
    .file-pill .clear-file:hover { color: #d0bd94; }
    .composer { display: flex; align-items: flex-end; gap: 8px; min-height: 59px; padding: 9px 11px 9px 9px; border: 1px solid rgba(224,207,169,.13); border-radius: 15px; background: #111310; box-shadow: 0 10px 38px rgba(0,0,0,.19), inset 0 1px rgba(255,255,255,.018); transition: border-color .2s ease, box-shadow .2s ease; }
    .composer:focus-within { border-color: rgba(196,164,106,.39); box-shadow: 0 0 0 3px rgba(196,164,106,.04), 0 12px 40px rgba(0,0,0,.22); }
    .composer textarea { display: block; flex: 1; min-height: 38px; max-height: 132px; padding: 10px 8px 7px; resize: none; overflow-y: auto; border: 0; outline: 0; background: transparent; color: #e9e6de; font-size: 13px; line-height: 1.65; }
    .composer textarea::placeholder { color: #77776f; }
    .composer textarea:disabled { opacity: .6; }
    .attach-btn { display: grid; width: 34px; height: 34px; flex: 0 0 auto; place-items: center; border: 1px solid transparent; border-radius: 9px; background: transparent; color: #8a8a82; transition: .18s ease; margin-bottom: 2px; }
    .attach-btn:hover { border-color: rgba(224,207,169,.1); background: rgba(255,255,255,.035); color: var(--gold-light); }
    .attach-btn:disabled { opacity: .4; cursor: not-allowed; }
    .send { display: grid; width: 38px; height: 38px; flex: 0 0 auto; place-items: center; border: 1px solid rgba(235,211,158,.45); border-radius: 11px; background: linear-gradient(145deg,#d2b477,#ad8d55); color: #15130f; box-shadow: 0 3px 12px rgba(196,164,106,.12); transition: .2s ease; }
    .send:not(:disabled):hover { filter: brightness(1.12); transform: translateY(-1px); }
    .send:disabled { cursor: default; opacity: .45; box-shadow: none; }
    .composer-meta { display: flex; justify-content: space-between; gap: 12px; padding: 9px 4px 0; color: #66675f; font-size: 9px; }
    .composer-meta span { direction: rtl; }
    .composer-meta .note { display: flex; align-items: center; gap: 5px; color: #777267; }
    .composer-meta .note svg { color: #9e875c; }
    #connStatus { transition: color .3s; }

    .thread.empty { justify-content: center; padding-bottom: 29px; }
    .welcome { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 16px 0 20px; text-align: center; animation: welcome-in .65s ease both; }
    .emblem-wrap { position: relative; display: grid; width: 134px; height: 128px; place-items: center; margin-bottom: 10px; }
    .emblem { position: relative; z-index: 2; display: grid; width: 74px; height: 74px; place-items: center; border: 1px solid rgba(196,164,106,.21); border-radius: 50%; background: radial-gradient(circle at 45% 35%,rgba(196,164,106,.13),rgba(196,164,106,.025) 70%); color: var(--gold); box-shadow: 0 0 40px rgba(196,164,106,.04), inset 0 0 22px rgba(196,164,106,.025); }
    .halo { position: absolute; border: 1px solid rgba(196,164,106,.085); border-radius: 50%; animation: breathe 5s ease-in-out infinite; }
    .halo.one { width: 103px; height: 103px; }
    .halo.two { width: 132px; height: 132px; border-color: rgba(196,164,106,.045); animation-delay: -2.3s; }
    .emblem-wrap::before { position: absolute; width: 176px; height: 176px; border-radius: 50%; background: radial-gradient(circle,rgba(196,164,106,.065),transparent 66%); content: ""; }
    .star { position: absolute; z-index: 3; color: var(--gold-light); font-size: 12px; }
    .star.one { top: 15px; right: 21px; opacity: .72; }
    .star.two { bottom: 19px; left: 18px; font-size: 23px; opacity: .62; }
    .eyebrow { display: flex; align-items: center; justify-content: center; gap: 9px; color: #aa9770; font-size: 10px; }
    .eyebrow i { width: 18px; height: 1px; background: rgba(196,164,106,.3); }
    .welcome h1 { margin: 12px 0 6px; color: #eeeae1; font-family: "Noto Naskh Arabic", "Times New Roman", serif; font-size: clamp(28px,3vw,36px); font-weight: 500; line-height: 1.4; }
    .welcome h1 span { color: var(--gold-light); }
    .welcome-copy { margin: 0; color: #85857d; font-size: 12px; line-height: 1.95; }
    .starter-area { display: flex; flex-direction: column; align-items: center; gap: 11px; width: min(100%,620px); margin-top: 30px; }
    .starter-label { color: #64655d; font-size: 10px; }
    .starter-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .starter-chip { display: flex; align-items: center; gap: 8px; min-height: 37px; padding: 0 11px; border: 1px solid rgba(224,207,169,.11); border-radius: 9px; background: rgba(255,255,255,.018); color: #aaa99f; font-size: 10px; transition: .2s ease; text-align: right; max-width: 100%; }
    .starter-chip:hover { transform: translateY(-2px); border-color: rgba(196,164,106,.38); background: rgba(196,164,106,.055); color: #e0d3b7; }
    .starter-index { color: #88724d; direction: ltr; font: 8px Arial,sans-serif; flex: 0 0 auto; }
    .starter-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .starter-arrow { color: #807255; transform: rotate(45deg); flex: 0 0 auto; }

    @keyframes message-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes welcome-in { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,60%,100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
    @keyframes breathe { 0%,100% { transform: scale(.97); opacity: .52; } 50% { transform: scale(1.04); opacity: .95; } }
    @media (min-width:1450px) { .thread { width: min(100%,880px); } .composer-wrap { width: min(100%,810px); } }
    @media (max-width:900px) { .sidebar { flex-basis: 245px; min-width: 230px; } .thread { padding-right: 24px; padding-left: 24px; } }
    @media (max-width:680px) {
      .app { min-height: 100dvh; }
      .sidebar { position: fixed; inset: 0 0 0 auto; width: min(84vw,305px); min-width: 0; height: 100dvh; padding-top: 24px; transform: translateX(105%); transition: transform .28s cubic-bezier(.2,.75,.2,1); box-shadow: -22px 0 65px rgba(0,0,0,.32); }
      .sidebar.open { transform: translateX(0); }
      .side-close { display: grid; }
      .scrim { position: fixed; z-index: 9; inset: 0; display: block; border: 0; background: rgba(0,0,0,.57); backdrop-filter: blur(3px); }
      .scrim[hidden] { display: none !important; }
      .topbar { flex-basis: 64px; padding: 0 15px; }
      .top-leading { gap: 7px; }
      .mobile-menu { display: grid; width: 32px; height: 32px; }
      .top-actions { gap: 8px; }
      .model { height: 30px; gap: 6px; padding: 0 8px; font-size: 9px; }
      .session-overline { font-size: 8px; }
      .session-title { max-width: 155px; font-size: 12px; }
      .thread { padding: 24px 17px 17px; }
      .thread-date { margin-bottom: 26px; }
      .messages { gap: 22px; }
      .message-content { max-width: 87%; }
      .bubble { font-size: 12px; }
      .dock { padding: 9px 12px max(12px,env(safe-area-inset-bottom)); }
      .composer { min-height: 56px; padding: 8px; gap: 5px; }
      .composer textarea { font-size: 12px; }
      .send { width: 36px; height: 36px; }
      .attach-btn { width: 32px; height: 32px; }
      .composer-meta { font-size: 8px; }
      .welcome { padding: 0 0 8px; }
      .emblem-wrap { width: 116px; height: 111px; }
      .emblem { width: 66px; height: 66px; }
      .halo.one { width: 92px; height: 92px; }
      .halo.two { width: 116px; height: 116px; }
      .welcome h1 { margin-top: 10px; font-size: 30px; }
      .welcome-copy { font-size: 11px; }
      .starter-area { margin-top: 24px; }
      .starter-list { flex-direction: column; align-items: stretch; width: min(100%,380px); }
      .starter-chip { justify-content: flex-start; min-height: 39px; }
      .starter-arrow { margin-right: auto; }
      .starter-text { white-space: normal; }
    }
    @media (max-width:390px) { .session-title { max-width: 112px; } .model { gap: 5px; padding: 0 7px; } .composer-meta { font-size: 7px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="app" dir="rtl">
    <button class="scrim" id="scrim" aria-label="إغلاق القائمة" hidden></button>
    <aside class="sidebar" id="sidebar" aria-label="قائمة المحادثات">
      <div class="brand-row">
        <div class="brand">
          <svg class="brand-mark" width="42" height="42" viewBox="0 0 44 44" fill="none" aria-hidden="true">
            <circle cx="22" cy="22" r="19.25" stroke="currentColor" stroke-opacity=".24"/><circle cx="22" cy="22" r="14.5" stroke="currentColor" stroke-opacity=".13"/>
            <path d="M13.5 25.7c2.1-7.3 11.7-13.8 17.1-9.3 3.2 2.7 1.7 8.4-2.2 11.4-4 3.1-9.7 2.9-12.6-.3" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/>
            <path d="M14 29.7c4.8 2 11.1.9 14.6-2.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-opacity=".7"/><circle cx="31.3" cy="13.4" r="1.35" fill="currentColor"/>
          </svg>
          <div><div class="brand-name">لورديرا<span class="gold-dot">.</span></div><div class="brand-caption">مساحة حوار ذكية</div></div>
        </div>
        <button class="icon-button side-close" id="closeSidebar" aria-label="إغلاق القائمة"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m18 6-12 12M6 6l12 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      </div>
      <button class="new-chat" id="newChat"><span class="new-chat-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span><span>محادثة جديدة</span><span class="shortcut">⌘ K</span></button>
      <div class="side-section">
        <div class="section-label"><span>مساحاتك</span><span class="count" id="chatCount">00</span></div>
        <div class="chat-list" id="chatList"></div>
      </div>
      <div class="side-bottom">
        <div class="preview-card">
          <div class="preview-title">
            <span class="preview-orbit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7L12 3ZM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></span>
            ثلاث خدمات في منصة واحدة
          </div>
          <p>محادثة نصية، تحويل الصوت إلى نص، وتحليل ذكي مع تحويل النص إلى صوت.</p>
        </div>
        <div class="profile"><div class="profile-avatar">ل</div><div class="profile-copy"><span>ضيف لورديرا</span><small>نسخة المعاينة</small></div><span class="profile-arrow">⌄</span></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="top-leading">
          <button class="icon-button mobile-menu" id="openSidebar" aria-label="فتح قائمة المحادثات"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
          <div class="session"><span class="session-overline">مساحة حوار</span><span class="session-title" id="sessionTitle">مساحة جديدة</span></div>
        </div>
        <div class="top-actions"><div class="model" title="جارٍ فحص الاتصال..."><span class="model-dot"></span><span>لورديرا</span><span aria-hidden="true">⌄</span></div><button class="icon-button top-new" id="topNew" aria-label="بدء محادثة جديدة" title="محادثة جديدة"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></div>
      </header>
      <section class="stage" aria-label="المحادثة"><div class="thread" id="thread"></div></section>
      <footer class="dock">
        <form class="composer-wrap" id="composerForm">
          <div class="file-pill" id="filePill" hidden>
            <span id="filePillText"></span>
            <button type="button" class="clear-file" id="clearFile" aria-label="إزالة الملف">✕</button>
          </div>
          <div class="composer">
            <textarea id="messageInput" rows="1" placeholder="اكتب رسالتك، أو اطلب تحليل نص، أو حوّله إلى صوت..." aria-label="اكتب رسالتك إلى لورديرا"></textarea>
            <button class="attach-btn" id="attachBtn" type="button" aria-label="إرفاق ملف صوتي" title="إرفاق ملف صوتي">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M21.44 11.05 12.25 20.24a6 6 0 0 1-8.49-8.49l8.57-8.57a4 4 0 0 1 5.66 5.66l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="send" id="sendButton" type="submit" disabled aria-label="إرسال الرسالة" title="إرسال"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 19V5m0 0L6 11m6-6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
          <div class="composer-meta">
            <span>Enter للإرسال <span style="color:#45463f">·</span> Shift + Enter لسطر جديد</span>
            <span class="note"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7L12 3Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg><span id="connStatus">جارٍ الاتصال...</span></span>
          </div>
        </form>
        <input type="file" id="audioInput" accept="audio/*" style="display:none">
      </footer>
    </main>
  </div>
  <script>
    "use strict";

    // ═══════════════════════════════════════════════════════════════
    // إعدادات الخادم (HTTPS لتفادي Mixed Content مع Akash ingress)
    // ═══════════════════════════════════════════════════════════════
    const API = "https://7dte737srt99h661rlls874vl8.ingress.zencloud.eu";

    const iconChat = '<svg class="chat-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l1.7-3.3A7.5 7.5 0 1 1 20 11.5Z" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"/></svg>';
    const logoSmall = '<svg class="brand-mark" width="26" height="26" viewBox="0 0 44 44" fill="none" aria-hidden="true"><circle cx="22" cy="22" r="19.25" stroke="currentColor" stroke-opacity=".24"/><circle cx="22" cy="22" r="14.5" stroke="currentColor" stroke-opacity=".13"/><path d="M13.5 25.7c2.1-7.3 11.7-13.8 17.1-9.3 3.2 2.7 1.7 8.4-2.2 11.4-4 3.1-9.7 2.9-12.6-.3" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/><path d="M14 29.7c4.8 2 11.1.9 14.6-2.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><circle cx="31.3" cy="13.4" r="1.35" fill="currentColor"/></svg>';

    // حالة نظيفة تمامًا — لا محادثات وهمية
    let chats = [];
    let activeId = null;
    let typingFor = null;
    let pendingAudio = null;

    const sidebar = document.getElementById("sidebar");
    const scrim = document.getElementById("scrim");
    const thread = document.getElementById("thread");
    const chatList = document.getElementById("chatList");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const sessionTitle = document.getElementById("sessionTitle");
    const audioInput = document.getElementById("audioInput");
    const filePill = document.getElementById("filePill");
    const filePillText = document.getElementById("filePillText");
    const attachBtn = document.getElementById("attachBtn");

    const activeChat = () => chats.find(chat => chat.id === activeId);
    const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
    const iconArrow = '<svg class="starter-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    function updateSendState() {
      const hasText = !!input.value.trim();
      const hasAudio = !!pendingAudio;
      sendButton.disabled = (!hasText && !hasAudio) || !!typingFor;
      attachBtn.disabled = !!typingFor;
    }

    function renderSidebar() {
      chatList.innerHTML = chats.map(chat => '<button class="chat-link ' + (chat.id === activeId ? 'active' : '') + '" data-chat="' + escapeHTML(chat.id) + '">' + iconChat + '<span class="chat-title">' + escapeHTML(chat.title) + '</span>' + (chat.id === activeId ? '<span class="active-mark"></span>' : '') + '</button>').join("");
      document.getElementById("chatCount").textContent = String(chats.length).padStart(2, "0");
      sessionTitle.textContent = activeChat()?.title || "مساحة جديدة";
    }

    function renderMedia(message) {
      if (!message.media?.base64 || !message.media?.type) return "";
      // صور لم تعد مدعومة — نتعامل مع الصوت فقط
      if (message.media.type.startsWith("audio/")) {
        return '<audio src="' + message.media.base64 + '" controls class="chat-media-audio"></audio>';
      }
      return "";
    }

    function renderAnalysis(analysis) {
      if (!analysis) return "";
      return '<details class="analysis-details"><summary>📊 التحليل البنيوي</summary><pre>' + escapeHTML(JSON.stringify(analysis, null, 2)) + '</pre></details>';
    }

    function renderMessage(message) {
      const user = message.role === "user";
      const suggestions = message.suggestions?.length
        ? '<div class="suggestions">' + message.suggestions.map(item => '<button data-follow="' + escapeHTML("أخبرني أكثر عن " + item) + '">' + escapeHTML(item) + '</button>').join("") + '</div>'
        : "";

      const textClass = message.error ? ' class="error-text"' : '';
      const bubbleInner =
        '<p' + textClass + '>' + escapeHTML(message.text || '') + '</p>' +
        renderMedia(message) +
        renderAnalysis(message.analysis) +
        suggestions;

      return '<article class="message-row ' + (user ? 'user' : 'assistant') + '">' +
        (user ? "" : '<div class="assistant-avatar">' + logoSmall + '</div>') +
        '<div class="message-content">' +
          (user ? "" : '<div class="author">لورديرا <span style="color:#55564f">·</span> <span class="time">الآن</span></div>') +
          '<div class="bubble ' + (user ? 'user-bubble' : 'assistant-bubble') + '">' + bubbleInner + '</div>' +
          (user ? "" : '<button class="copy-button" data-copy="' + escapeHTML(message.id) + '" aria-label="نسخ الرد"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3" stroke="currentColor" stroke-width="1.5"/></svg><span>نسخ</span></button>') +
        '</div></article>';
    }

    function renderWelcome() {
      const prompts = [
        { text: "اكتب لي فقرة قصيرة عن هدوء الصباح", hint: "نص" },
        { text: "حوّل هذه الجملة إلى صوت: أهلاً بك في لورديرا", hint: "صوت" },
        { text: "حلّل هذا النص: الذكاء الاصطناعي يغيّر طريقة عملنا", hint: "تحليل" }
      ];
      return '<div class="welcome"><div class="emblem-wrap"><div class="halo one"></div><div class="halo two"></div><div class="emblem">' + logoSmall.replace('width="26" height="26"', 'width="58" height="58"') + '</div><span class="star one">✳</span><span class="star two">·</span></div><div class="eyebrow"><i></i> مساحةٌ لك <i></i></div><h1>دع الفكرة <span>تتّسع.</span></h1><p class="welcome-copy">لا تحتاج أن تعرف من أين تبدأ.<br>اكتب ما يدور في بالك، ونكتشفه معًا.</p><div class="starter-area"><span class="starter-label">أو ابدأ من هنا</span><div class="starter-list">' + prompts.map((prompt, index) => '<button class="starter-chip" data-start="' + escapeHTML(prompt.text) + '" title="' + escapeHTML(prompt.hint) + '"><span class="starter-index">0' + (index + 1) + '</span><span class="starter-text">' + escapeHTML(prompt.text) + '</span>' + iconArrow + '</button>').join("") + '</div></div></div>';
    }

    function renderThread() {
      const chat = activeChat();
      if (!chat || !chat.messages.length) {
        sessionTitle.textContent = chat?.title || "مساحة جديدة";
        thread.className = "thread empty";
        thread.innerHTML = renderWelcome();
        return;
      }
      sessionTitle.textContent = chat.title;
      thread.className = "thread";
      thread.innerHTML = '<div class="thread-date"><span></span>بداية محادثة<span></span></div><div class="messages">' + chat.messages.map(renderMessage).join("") + (typingFor === chat.id ? '<article class="message-row assistant"><div class="assistant-avatar">' + logoSmall + '</div><div class="message-content"><div class="author">لورديرا <span style="color:#55564f">·</span> <span class="time">يفكّر بهدوء</span></div><div class="typing-bubble" aria-label="لورديرا يكتب ردًا"><i></i><i></i><i></i></div></div></article>' : '') + '</div>';
      requestAnimationFrame(() => { const stage = document.querySelector(".stage"); if (stage) stage.scrollTop = stage.scrollHeight; });
    }

    function render() { renderSidebar(); renderThread(); updateSendState(); }
    function titleFrom(text) { const value = text.trim(); return value.length > 30 ? value.slice(0, 29) + "…" : value; }

    function ensureActiveChat() {
      let chat = activeChat();
      if (!chat) {
        const id = "chat-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7);
        chats.unshift({ id, title: "محادثة جديدة", messages: [] });
        activeId = id;
        chat = activeChat();
      }
      return chat;
    }

    // ═══════════════════════════════════════════════════════════════
    // إرسال نص → POST /chat
    // ═══════════════════════════════════════════════════════════════
    async function sendMessage(raw) {
      const value = (raw || "").trim();
      if (!value || typingFor) return;
      const chat = ensureActiveChat();
      if (!chat) return;

      chat.messages.push({ id: "u-" + Date.now(), role: "user", text: value });
      if (chat.title === "محادثة جديدة") chat.title = titleFrom(value);
      input.value = "";
      input.style.height = "auto";
      input.disabled = true;
      typingFor = chat.id;
      render();
      input.focus();

      try {
        const history = chat.messages.map(m => ({ role: m.role, content: m.text }));
        const res = await fetch(API + "/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || ("HTTP " + res.status));
        }
        const data = await res.json();
        chat.messages.push({
          id: "a-" + Date.now(),
          role: "assistant",
          text: data.reply || "",
          media: (data.media_base64 && data.media_content_type)
            ? { base64: data.media_base64, type: data.media_content_type }
            : null,
          analysis: data.analysis || null,
        });
      } catch (e) {
        chat.messages.push({
          id: "a-" + Date.now(),
          role: "assistant",
          text: "تعذّر الاتصال بالخادم. تأكد من الشبكة وحاول مجددًا.",
          error: true,
        });
      } finally {
        typingFor = null;
        input.disabled = false;
        render();
        input.focus();
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // إرسال صوت → POST /transcribe ثم /chat
    // ═══════════════════════════════════════════════════════════════
    async function sendAudio(file, text = "") {
      if (!file || typingFor) return;
      const chat = ensureActiveChat();
      if (!chat) return;

      const userMsgId = "u-" + Date.now();
      const audioUrl = URL.createObjectURL(file);
      let displayText = "🎤 [رسالة صوتية: " + file.name + "]";
      if (text) displayText = text + "\n" + displayText;

      chat.messages.push({
        id: userMsgId,
        role: "user",
        text: displayText,
        media: { base64: audioUrl, type: file.type || "audio/mpeg" }
      });

      if (chat.title === "محادثة جديدة") chat.title = text ? titleFrom(text) : "رسالة صوتية";
      input.disabled = true;
      typingFor = chat.id;
      render();

      try {
        const fd = new FormData();
        fd.append("file", file);
        const tRes = await fetch(API + "/transcribe", { method: "POST", body: fd });
        if (!tRes.ok) {
          const err = await tRes.json().catch(() => ({}));
          throw new Error(err.detail || ("HTTP " + tRes.status));
        }
        const { transcript } = await tRes.json();

        const userMsg = chat.messages.find(m => m.id === userMsgId);
        if (userMsg) {
          let finalText = "";
          if (text) finalText += text;
          if (transcript && transcript.trim()) {
            if (finalText) finalText += "\n\n";
            finalText += "🎤 " + transcript;
          }
          userMsg.text = finalText || "🎤 [رسالة صوتية فارغة]";
        }

        if (!transcript || !transcript.trim()) {
          if (!text) {
            chat.messages.push({
              id: "a-" + Date.now(),
              role: "assistant",
              text: "لم أسمع شيئًا واضحًا في التسجيل.",
              error: true,
            });
            return;
          }
        }

        const history = chat.messages.map(m => ({ role: m.role, content: m.text }));
        const cRes = await fetch(API + "/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        if (!cRes.ok) {
          const err = await cRes.json().catch(() => ({}));
          throw new Error(err.detail || ("HTTP " + cRes.status));
        }
        const data = await cRes.json();
        chat.messages.push({
          id: "a-" + Date.now(),
          role: "assistant",
          text: data.reply || "",
          media: (data.media_base64 && data.media_content_type)
            ? { base64: data.media_base64, type: data.media_content_type }
            : null,
          analysis: data.analysis || null,
        });
      } catch (e) {
        chat.messages.push({
          id: "a-" + Date.now(),
          role: "assistant",
          text: "تعذّر معالجة الملف الصوتي. حاول مجددًا.",
          error: true,
        });
      } finally {
        typingFor = null;
        input.disabled = false;
        render();
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // فحص صحة الخادم → GET /health
    // ═══════════════════════════════════════════════════════════════
    async function checkHealth() {
      const dot = document.querySelector(".model-dot");
      const badge = dot?.parentElement;
      const statusEl = document.getElementById("connStatus");
      try {
        const r = await fetch(API + "/health", { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        const healthy = d.status === "healthy";
        const groqOk = d.groq_api_configured ?? false;
        const cartesiaOk = d.cartesia_api_configured ?? false;
        if (healthy && groqOk && cartesiaOk) {
          if (dot) { dot.style.background = "#7fae7b"; dot.style.boxShadow = "0 0 7px rgba(127,174,123,.5)"; }
          if (badge) badge.title = "الخادم متصل — Groq وCartesia جاهزان";
          if (statusEl) { statusEl.textContent = "متصل"; statusEl.style.color = "#9ebf9a"; }
        } else if (!groqOk) {
          if (dot) { dot.style.background = "#c08a5a"; dot.style.boxShadow = "0 0 7px rgba(192,138,90,.4)"; }
          if (badge) badge.title = "مفتاح Groq مفقود على الخادم";
          if (statusEl) { statusEl.textContent = "مفتاح Groq مفقود"; statusEl.style.color = "#c0a070"; }
        } else if (!cartesiaOk) {
          if (dot) { dot.style.background = "#c08a5a"; dot.style.boxShadow = "0 0 7px rgba(192,138,90,.4)"; }
          if (badge) badge.title = "مفتاح Cartesia مفقود على الخادم";
          if (statusEl) { statusEl.textContent = "مفتاح Cartesia مفقود"; statusEl.style.color = "#c0a070"; }
        } else {
          if (dot) { dot.style.background = "#b49a68"; dot.style.boxShadow = "0 0 7px rgba(180,154,104,.4)"; }
          if (badge) badge.title = "الخادم متاح جزئياً";
          if (statusEl) { statusEl.textContent = "متاح جزئياً"; statusEl.style.color = "#c0a070"; }
        }
      } catch {
        if (dot) { dot.style.background = "#a35a5a"; dot.style.boxShadow = "0 0 7px rgba(163,90,90,.4)"; }
        if (badge) badge.title = "تعذّر الوصول إلى الخادم";
        if (statusEl) { statusEl.textContent = "غير متصل"; statusEl.style.color = "#b07a6a"; }
      }
    }

    function newConversation() {
      const id = "chat-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7);
      chats.unshift({ id, title: "محادثة جديدة", messages: [] });
      activeId = id;
      input.value = "";
      input.style.height = "auto";
      pendingAudio = null;
      filePill.hidden = true;
      closeSidebar();
      render();
      setTimeout(() => input.focus(), 80);
    }
    function openSidebar() { sidebar.classList.add("open"); scrim.hidden = false; }
    function closeSidebar() { sidebar.classList.remove("open"); scrim.hidden = true; }

    function setPendingAudio(file) {
      pendingAudio = file;
      if (file) {
        filePillText.textContent = "📎 " + file.name;
        filePill.hidden = false;
      } else {
        filePillText.textContent = "";
        filePill.hidden = true;
        audioInput.value = "";
      }
      updateSendState();
    }

    // ─── الأحداث ────────────────────────────────────────────────────
    document.getElementById("newChat").addEventListener("click", newConversation);
    document.getElementById("topNew").addEventListener("click", newConversation);
    document.getElementById("openSidebar").addEventListener("click", openSidebar);
    document.getElementById("closeSidebar").addEventListener("click", closeSidebar);
    scrim.addEventListener("click", closeSidebar);

    document.getElementById("composerForm").addEventListener("submit", async event => {
      event.preventDefault();
      if (typingFor) return;
      const textVal = input.value.trim();
      if (pendingAudio) {
        const f = pendingAudio;
        setPendingAudio(null);
        input.value = ""; 
        input.style.height = "auto";
        await sendAudio(f, textVal);
      } else if (textVal) {
        await sendMessage(textVal);
      }
    });

    attachBtn.addEventListener("click", () => { if (!typingFor) audioInput.click(); });
    audioInput.addEventListener("change", e => {
      const f = e.target.files?.[0];
      if (f) setPendingAudio(f);
    });
    document.getElementById("clearFile").addEventListener("click", () => setPendingAudio(null));

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 132) + "px";
      updateSendState();
    });
    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        if (!typingFor) document.getElementById("composerForm").requestSubmit();
      }
    });

    document.addEventListener("click", async event => {
      const target = event.target.closest("button");
      if (!target) return;
      if (target.dataset.chat) {
        activeId = target.dataset.chat;
        closeSidebar();
        render();
      } else if (target.dataset.start) {
        sendMessage(target.dataset.start);
      } else if (target.dataset.follow) {
        sendMessage(target.dataset.follow);
      } else if (target.dataset.copy) {
        const message = activeChat()?.messages.find(item => item.id === target.dataset.copy);
        if (message) {
          try {
            await navigator.clipboard.writeText(message.text);
            const label = target.querySelector("span");
            if (label) {
              label.textContent = "نُسخ";
              setTimeout(() => { if (label) label.textContent = "نسخ"; }, 1500);
            }
          } catch {
            const label = target.querySelector("span");
            if (label) label.textContent = "تعذّر النسخ";
          }
        }
      }
    });

    document.addEventListener("keydown", event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
        event.preventDefault();
        newConversation();
      }
      if (event.key === "Escape") closeSidebar();
    });

    // ─── التهيئة ────────────────────────────────────────────────────
    render();
    checkHealth();
    setInterval(checkHealth, 30000);
  </script>
</body>
</html>
