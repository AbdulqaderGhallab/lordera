<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lordera AI</title>
    <style>
        :root {
            --bg-base: #0b1120;
            --bg-panel: #1e293b;
            --bg-user: #2563eb;
            --bg-ai: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #475569;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background: var(--bg-base); color: var(--text);
            display: flex; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        .app {
            width: 100%; max-width: 900px; height: 100%;
            display: flex; flex-direction: column;
            background: var(--bg-panel);
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        /* Header */
        .header {
            padding: 14px 20px; background: var(--bg-base);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .header h1 {
            font-size: 20px;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .status { font-size: 12px; color: var(--success);
                  display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; background: var(--success);
               border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .dot.offline { background: var(--danger); animation: none; }

        /* Chat area */
        .chat {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 14px;
        }
        .chat::-webkit-scrollbar { width: 6px; }
        .chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        .msg {
            display: flex; gap: 10px; max-width: 88%;
            animation: slide 0.25s ease;
        }
        @keyframes slide { from{opacity:0; transform: translateY(8px)} to{opacity:1; transform:none} }
        .msg.user { align-self: flex-start; flex-direction: row-reverse; }
        .msg.ai   { align-self: flex-end; }
        .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; flex-shrink: 0;
        }
        .avatar.user { background: #475569; }
        .avatar.ai   { background: linear-gradient(135deg, #1d4ed8, #7c3aed); }
        .bubble {
            padding: 12px 16px; border-radius: 14px;
            font-size: 15px; line-height: 1.6;
            word-wrap: break-word; max-width: 100%;
        }
        .user .bubble { background: var(--bg-user); color: white; border-top-right-radius: 3px; }
        .ai .bubble   { background: var(--bg-ai); color: var(--text); border-top-left-radius: 3px; }

        .typing { display: flex; gap: 5px; padding: 4px 0; }
        .typing span {
            width: 8px; height: 8px; background: var(--muted);
            border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing span:nth-child(1){animation-delay:-0.32s}
        .typing span:nth-child(2){animation-delay:-0.16s}
        @keyframes bounce { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }

        .chat-img { max-width: 100%; border-radius: 10px; margin-top: 8px;
                    border: 1px solid var(--border); display: block; }
        .chat-audio { width: 100%; margin-top: 8px; }

        pre {
            background: #0b1120; padding: 10px; border-radius: 8px;
            overflow-x: auto; font-size: 12px; margin-top: 8px;
            border: 1px solid var(--border);
            direction: ltr; text-align: left;
            font-family: 'Courier New', monospace;
        }
        details summary { cursor: pointer; color: var(--primary); margin-top: 8px; }

        /* Input */
        .input-area {
            padding: 14px 20px; background: var(--bg-base);
            border-top: 1px solid var(--border);
            display: flex; align-items: flex-end; gap: 10px;
        }
        .input-wrap {
            flex: 1; background: var(--bg-panel);
            border: 1px solid var(--border); border-radius: 24px;
            display: flex; align-items: center;
            padding: 4px 14px; transition: border-color 0.2s;
        }
        .input-wrap:focus-within { border-color: var(--primary); }
        textarea {
            flex: 1; background: transparent; border: none;
            color: var(--text); font-size: 15px;
            resize: none; padding: 10px 0;
            max-height: 150px; outline: none; overflow-y: auto;
        }
        .icon-btn {
            background: none; border: none; color: var(--muted);
            font-size: 22px; cursor: pointer; padding: 4px;
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; transition: color 0.2s;
        }
        .icon-btn:hover { color: var(--primary); }
        .send-btn {
            background: var(--primary); color: white; border: none;
            width: 44px; height: 44px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center;
            justify-content: center; font-size: 18px;
            transition: background 0.2s; flex-shrink: 0;
        }
        .send-btn:hover { background: #2563eb; }
        .send-btn:disabled { background: var(--border); cursor: not-allowed; }

        .file-pill {
            display: none; font-size: 12px; color: var(--success);
            padding: 4px 10px; border-radius: 12px;
            background: rgba(16,185,129,0.1);
            border: 1px solid var(--success);
            margin: 4px 0;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>Lordera AI</h1>
        <div class="status">
            <div class="dot" id="statusDot"></div>
            <span id="statusText">جارٍ الاتصال...</span>
        </div>
    </div>

    <div class="chat" id="chatArea">
        <div class="msg ai">
            <div class="avatar ai">🤖</div>
            <div class="bubble">
                أهلاً بك في Lordera AI! 👋<br>
                أنا مساعد ذكي — أتكلم معك بشكل طبيعي، وأرسم الصور، وأحوّل النص إلى صوت،
                وأستمع إلى ملفاتك الصوتية وأحوّلها إلى نص.<br><br>
                <span style="font-size:13px;color:#94a3b8;">
                    جرّب: «كيف حالك؟» • «ارسم قطة في مكتبة» • «قل: مرحباً بكم» • «حلّل: المنتج ممتاز لكن السعر مرتفع»
                </span>
            </div>
        </div>
    </div>

    <div class="input-area">
        <input type="file" id="fileInput" accept="audio/*" style="display:none" onchange="onFilePick()">
        <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="إرفاق ملف صوتي">📎</button>
        <div class="input-wrap">
            <textarea id="chatInput" rows="1" placeholder="اكتب رسالتك..."></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="onSend()">➤</button>
    </div>
    <div class="file-pill" id="filePill"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// CONFIG — ضع رابط الـ Ingress هنا
// ═══════════════════════════════════════════════════════════════════
const API = "http://ehrdtp1td1e73flsodd94ka5b8.ingress.akash.rhite.co.uk";

// State
let history = [];          // [{role, content}]
let attachedFile = null;
let busy = false;

// Refs
const chatArea  = document.getElementById('chatArea');
const chatInput = document.getElementById('chatInput');
const fileInput = document.getElementById('fileInput');
const sendBtn   = document.getElementById('sendBtn');
const filePill  = document.getElementById('filePill');
const statusDot = document.getElementById('statusDot');
const statusText= document.getElementById('statusText');

// ═══════════════════════════════════════════════════════════════════
// Utilities
// ═══════════════════════════════════════════════════════════════════
function esc(s) {
    return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;")
        .replace(/\n/g, "<br>");
}

function addBubble(role, html) {
    const id = 'm' + Date.now() + Math.random().toString(36).slice(2,6);
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.id = id;
    div.innerHTML = `
        <div class="avatar ${role}">${role === 'user' ? '👤' : '🤖'}</div>
        <div class="bubble" id="${id}-b">${html}</div>
    `;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return id;
}

function updateBubble(id, html) {
    const b = document.getElementById(`${id}-b`);
    if (b) b.innerHTML = html;
    chatArea.scrollTop = chatArea.scrollHeight;
}

function typingHtml() {
    return `<div class="typing"><span></span><span></span><span></span></div>`;
}

function setBusy(b) {
    busy = b;
    sendBtn.disabled = b;
}

// ═══════════════════════════════════════════════════════════════════
// Health check
// ═══════════════════════════════════════════════════════════════════
async function checkHealth() {
    try {
        const r = await fetch(`${API}/health`);
        if (!r.ok) throw new Error();
        const d = await r.json();
        if (d.groq_api_configured) {
            statusDot.classList.remove('offline');
            statusText.textContent = 'متصل';
        } else {
            statusDot.classList.add('offline');
            statusText.textContent = 'مفتاح Groq مفقود';
        }
    } catch {
        statusDot.classList.add('offline');
        statusText.textContent = 'غير متصل';
    }
}
checkHealth();
setInterval(checkHealth, 30000);

// ═══════════════════════════════════════════════════════════════════
// File attach
// ═══════════════════════════════════════════════════════════════════
function onFilePick() {
    if (fileInput.files.length > 0) {
        attachedFile = fileInput.files[0];
        filePill.style.display = 'inline-block';
        filePill.textContent = `📎 ${attachedFile.name}`;
    }
}

// ═══════════════════════════════════════════════════════════════════
// Auto-resize textarea
// ═══════════════════════════════════════════════════════════════════
chatInput.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 150) + 'px';
});
chatInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        onSend();
    }
});

// ═══════════════════════════════════════════════════════════════════
// Main entry
// ═══════════════════════════════════════════════════════════════════
async function onSend() {
    if (busy) return;

    const text = chatInput.value.trim();
    const file = attachedFile;

    if (!text && !file) return;

    chatInput.value = '';
    chatInput.style.height = 'auto';
    attachedFile = null;
    fileInput.value = '';
    filePill.style.display = 'none';

    setBusy(true);
    try {
        if (file) {
            await handleAudio(file);
        } else {
            await handleText(text);
        }
    } finally {
        setBusy(false);
    }
}

// ═══════════════════════════════════════════════════════════════════
// TEXT → /chat
// ═══════════════════════════════════════════════════════════════════
async function handleText(text) {
    addBubble('user', esc(text));
    history.push({ role: 'user', content: text });

    const msgId = addBubble('ai', typingHtml());

    try {
        const res = await fetch(`${API}/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: history }),
        });
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || `HTTP ${res.status}`);
        }
        const data = await res.json();
        updateBubble(msgId, renderChat(data));
        if (data.reply) history.push({ role: 'assistant', content: data.reply });
    } catch (e) {
        updateBubble(msgId, `<span style="color:#ef4444">❌ ${esc(e.message)}</span>`);
    }
}

// ═══════════════════════════════════════════════════════════════════
// AUDIO → /transcribe → /chat
// ═══════════════════════════════════════════════════════════════════
async function handleAudio(file) {
    addBubble('user', `🎤 <em>[رسالة صوتية: ${esc(file.name)}]</em>`);

    const msgId = addBubble('ai', typingHtml() + `<div style="font-size:12px;color:#94a3b8;margin-top:6px">جاري الاستماع...</div>`);

    try {
        const fd = new FormData();
        fd.append('file', file);
        const res = await fetch(`${API}/transcribe`, { method: 'POST', body: fd });
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || `HTTP ${res.status}`);
        }
        const { transcript } = await res.json();

        if (!transcript || !transcript.trim()) {
            updateBubble(msgId, `📝 لم أسمع شيئاً واضحاً في التسجيل.`);
            return;
        }

        updateBubble(msgId,
            `<b>📝 سمعت:</b><br>${esc(transcript)}<br><br>` + typingHtml()
        );

        history.push({ role: 'user', content: transcript });

        const chatRes = await fetch(`${API}/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: history }),
        });
        if (!chatRes.ok) {
            const err = await chatRes.json().catch(() => ({}));
            throw new Error(err.detail || `HTTP ${chatRes.status}`);
        }
        const data = await chatRes.json();

        updateBubble(msgId,
            `<b>📝 سمعت:</b><br>${esc(transcript)}<br><br>` + renderChat(data)
        );
        if (data.reply) history.push({ role: 'assistant', content: data.reply });
    } catch (e) {
        updateBubble(msgId, `<span style="color:#ef4444">❌ ${esc(e.message)}</span>`);
    }
}

// ═══════════════════════════════════════════════════════════════════
// Render chat response (text + optional image/audio/analysis)
// ═══════════════════════════════════════════════════════════════════
function renderChat(data) {
    let html = esc(data.reply || '');
    if (data.media_base64 && data.media_content_type) {
        if (data.media_content_type.startsWith('image/')) {
            html += `<img src="${data.media_base64}" class="chat-img" alt="generated">`;
        } else if (data.media_content_type.startsWith('audio/')) {
            html += `<audio src="${data.media_base64}" controls class="chat-audio"></audio>`;
        }
    }
    if (data.analysis) {
        html += `<details><summary>📊 التحليل</summary><pre>${esc(JSON.stringify(data.analysis, null, 2))}</pre></details>`;
    }
    return html;
}
</script>
</body>
</html>
