---
version: "2.0"

services:
  gateway:
    image: abdulqaderghallab/lordera-gateway:v11
    env:
      # ── Groq API (Whisper + Qwen) ────────────────────────────────────
      - "GROQ_API_KEY=xxx"
      - "GROQ_WHISPER_MODEL=whisper-large-v3"
      - "GROQ_QWEN_MODEL=qwen/qwen3.8-27b"
      # ── Pollinations.ai (TTS + Image) ────────────────────────────────
      - "POLLINATIONS_API_KEY=xxx"
      # ── Queue & Rate limiting ─────────────────────────────────────────
      - "MAX_QUEUE_SIZE=50"
      - "REJECT_THRESHOLD=0.9"
      - "JOB_TTL_SECONDS=1800"
      - "JOB_CLEANUP_INTERVAL=60"
      - "MAX_JOBS_IN_STORE=1000"
      - "RATE_LIMIT_WINDOW=60.0"
      - "RATE_LIMIT_MAX=10"
      # ── Upload & timeouts ────────────────────────────────────────────
      - "MAX_UPLOAD_SIZE=26214400"
      - "WHISPER_TIMEOUT=120.0"
      - "QWEN_TIMEOUT=60.0"
      - "TTS_TIMEOUT=60.0"
      - "IMAGE_TIMEOUT=120.0"
      - "LEGACY_WAIT_TIMEOUT=120.0"
      - "MAX_RETRIES=3"
      - "RETRY_BACKOFF=2.0"
    expose:
      - port: 8000
        as: 80
        to:
          - global: true

profiles:
  compute:
    lordera-group:
      resources:
        cpu:
          units: 1.0
        memory:
          size: 2Gi
        storage:
          - size: 5Gi
  placement:
    akash:
      pricing:
        lordera-group:
          denom: uact
          amount: 20000

deployment:
  gateway:
    akash:
      profile: lordera-group
      count: 1